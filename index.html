<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Cube box</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --accent: #F97316; --accent-glow: rgba(249,115,22,0.4); --card: rgba(255,255,255,0.06); --card-border: rgba(255,255,255,0.1); --text: #F5F5F5; --text-muted: #A3A3A3; --danger: #EF4444; --gold: #FCD34D; }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{background:#0A0A0A;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Nunito',sans-serif;color:var(--text);touch-action:manipulation}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 80%,rgba(249,115,22,0.06),transparent 60%);pointer-events:none;z-index:0}
        #game-wrapper{position:relative;width:380px;height:640px;max-width:100vw;max-height:100vh;overflow:hidden;border-radius:12px;box-shadow:0 0 60px rgba(249,115,22,0.1),0 0 120px rgba(0,0,0,0.6);z-index:1}
        #canvas{display:block;width:100%;height:100%}
        .screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:10;background:rgba(10,10,10,0.9);backdrop-filter:blur(12px)}
        .screen.active{display:flex}
        
        .auth-content, .dash-content, .rank-content { text-align:center; width:88%; max-width:300px; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
        
        h1, h2 { font-family:'Bungee',cursive; color:var(--accent); text-shadow:0 0 20px var(--accent-glow); margin-bottom:15px; line-height:1.1; }
        h1 { font-size: 32px; }
        h2 { font-size: 24px; }
        
        .btn{display:block;width:100%;padding:12px 0;margin:8px 0;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:all 0.15s;letter-spacing:0.5px}
        .btn:active{transform:scale(0.95)}
        .btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 20px var(--accent-glow)}
        .btn-primary:hover{background:#EA580C}
        .btn-google{background:#FFF;color:#333;display:flex;justify-content:center;align-items:center;gap:10px}
        .btn-google img { width: 20px; height: 20px; }
        .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--card-border)}
        .btn-danger{background:var(--danger);color:#fff}
        
        .input-group{margin-bottom:12px;text-align:left}
        .input-group label{font-size:12px;color:var(--text-muted);margin-bottom:4px;display:block}
        .input-group input{width:100%;padding:10px 12px;border:1px solid var(--card-border);border-radius:6px;background:rgba(255,255,255,0.05);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;outline:none}
        .input-group input:focus{border-color:var(--accent)}
        
        .divider{display:flex;align-items:center;margin:15px 0;color:var(--text-muted);font-size:12px}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--card-border)}
        .divider span{padding:0 10px}

        .dash-stats{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:20px;margin:15px 0;display:flex;flex-direction:column;gap:10px}
        .stat-row{display:flex;justify-content:space-between;align-items:center;font-weight:800}
        .stat-row .label{color:var(--text-muted);font-size:13px}
        .stat-row .value{font-size:20px;color:var(--gold)}
        .user-info{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--card-border)}
        .user-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;justify-content:center;align-items:center;font-weight:900;font-size:18px;color:#fff}
        .user-name{font-weight:800;font-size:16px;text-align:left;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        
        #full-lb{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:8px;margin-bottom:15px;max-height:350px;overflow-y:auto}
        .lb-head{font-size:11px;color:var(--text-muted);text-align:center;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
        .lb-entry{display:flex;align-items:center;padding:4px 6px;border-radius:4px;font-size:12px;font-weight:700;margin-bottom:2px}
        .lb-entry.me{background:rgba(249,115,22,0.15);border:1px solid rgba(249,115,22,0.3)}
        .lb-rank{width:25px;text-align:center;font-weight:900}
        .lb-name{flex:1;margin:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .lb-sc{font-weight:900;color:var(--accent)}
        
        .error-msg{color:var(--danger);font-size:12px;margin-top:5px;min-height:15px}
        
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:2px}
        @media(max-height:660px){#game-wrapper{height:100vh;border-radius:0}}@media(max-width:400px){#game-wrapper{width:100vw;border-radius:0}}
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="canvas"></canvas>
    
    <div id="login-screen" class="screen active">
        <div class="auth-content">
            <h1>FLAPPY CUBE<br>BOX</h1>
            <p style="color:var(--text-muted); margin-bottom:20px; font-size:14px">Masuk untuk Di mainkan dan rasakan sensasinya sensei</p>
            <button class="btn btn-google" id="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G"> Masuk dengan Google
            </button>
            <div class="divider"><span>ATAU</span></div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email-input" placeholder="kamu@email.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="pass-input" placeholder="Min 6 karakter">
            </div>
            <div class="error-msg" id="auth-error"></div>
            <button class="btn btn-primary" id="btn-email-login">MASUK</button>
            <button class="btn btn-secondary" id="btn-email-register" style="font-size:13px; margin-top:5px">DAFTAR AKUN BARU</button>
        </div>
    </div>

    <div id="dash-screen" class="screen">
        <div class="dash-content">
            <h2>DASHBOARD</h2>
            <div class="dash-stats">
                <div class="user-info">
                    <div class="user-avatar" id="dash-avatar">?</div>
                    <div class="user-name" id="dash-name">Memuat...</div>
                </div>
                <div class="stat-row"><span class="label">POIN TERTINGGI</span><span class="value" id="dash-score">0</span></div>
                <div class="stat-row"><span class="label">PERINGKAT GLOBAL</span><span class="value" id="dash-rank">-</span></div>
            </div>
            <button class="btn btn-primary" id="btn-play"><i class="fas fa-play"></i> MAIN</button>
            <button class="btn btn-secondary" id="btn-leaderboard"><i class="fas fa-trophy"></i> PAPAN PERINGKAT</button>
            <button class="btn btn-danger" id="btn-logout" style="margin-top:15px; font-size:13px"><i class="fas fa-sign-out-alt"></i> KELUAR</button>
        </div>
    </div>

    <div id="rank-screen" class="screen">
        <div class="rank-content">
            <h2><i class="fas fa-trophy"></i> PERINGKAT GLOBAL</h2>
            <div id="full-lb">Memuat data...</div>
            <button class="btn btn-secondary" id="btn-back-dash"><i class="fas fa-arrow-left"></i> KEMBALI</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDtxVIjlvTk3PqR1-USrSxhCSMyS25PigI",
  authDomain: "flappy-cubebox.firebaseapp.com",
  databaseURL: "https://flappy-cubebox-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "flappy-cubebox",
  storageBucket: "flappy-cubebox.firebasestorage.app",
  messagingSenderId: "592973816617",
  appId: "1:592973816617:web:8962d617cc98c835638d38",
  measurementId: "G-8J0PD8RH39"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let currentUserBestScore = 0;

const $login = document.getElementById('login-screen');
const $dash = document.getElementById('dash-screen');
const $rank = document.getElementById('rank-screen');
const $authErr = document.getElementById('auth-error');

function showScreen(id) {
    [$login, $dash, $rank].forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

auth.onAuthStateChanged(user => {
    if (user) {
        currentUser = user;
        loadUserDataAndShowDash();
    } else {
        currentUser = null;
        showScreen('login-screen');
    }
});

document.getElementById('btn-google').addEventListener('click', () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => $authErr.textContent = e.message);
});

document.getElementById('btn-email-login').addEventListener('click', () => {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(!email || !pass) { $authErr.textContent = "Email & Password harus diisi!"; return; }
    auth.signInWithEmailAndPassword(email, pass).catch(e => $authErr.textContent = e.message);
});

document.getElementById('btn-email-register').addEventListener('click', () => {
    const email = document.getElementById('email-input').value;
    const pass = document.getElementById('pass-input').value;
    if(!email || !pass) { $authErr.textContent = "Email & Password harus diisi!"; return; }
    auth.createUserWithEmailAndPassword(email, pass).catch(e => $authErr.textContent = e.message);
});

document.getElementById('btn-logout').addEventListener('click', () => {
    if (state === 'PLAYING' || state === 'READY') return; 
    auth.signOut();
});

function loadUserDataAndShowDash() {
    if (!currentUser) return;
    const name = currentUser.displayName || currentUser.email.split('@')[0];
    const initial = name.charAt(0).toUpperCase();
    document.getElementById('dash-name').textContent = name;
    document.getElementById('dash-avatar').textContent = initial;

    const userRef = db.ref('leaderboard/' + currentUser.uid);
    userRef.once('value').then(snapshot => {
        const data = snapshot.val();
        currentUserBestScore = data ? data.score : 0;
        document.getElementById('dash-score').textContent = currentUserBestScore;
        updateGlobalRank();
    });
    showScreen('dash-screen');
}

function updateGlobalRank() {
    if (!currentUser) return;
    const ref = db.ref('leaderboard').orderByChild('score');
    ref.once('value').then(snapshot => {
        let rank = 0;
        let total = 0;
        snapshot.forEach(child => { total++; if(child.key === currentUser.uid) rank = total; });
        document.getElementById('dash-rank').textContent = rank === 0 ? '-' : `#${(total - rank + 1)}`;
    });
}

function saveScoreToFirebase(finalScore) {
    if (!currentUser) return;
    if (finalScore > currentUserBestScore) {
        currentUserBestScore = finalScore;
        const name = currentUser.displayName || currentUser.email.split('@')[0];
        db.ref('leaderboard/' + currentUser.uid).set({
            name: name,
            score: finalScore,
            date: new Date().toLocaleDateString('id-ID')
        });
        document.getElementById('dash-score').textContent = finalScore;
        updateGlobalRank();
    }
}

function renderOnlineLeaderboard() {
    const lbContainer = document.getElementById('full-lb');
    lbContainer.innerHTML = '<div class="lb-head">Memuat peringkat dunia...</div>';
    const ref = db.ref('leaderboard').orderByChild('score').limitToLast(20);
    ref.once('value').then(snapshot => {
        let html = '<div class="lb-head">TOP 20 DUNIA</div>';
        let items = [];
        snapshot.forEach(child => items.push({ uid: child.key, ...child.val() }));
        items.reverse(); 
        
        items.forEach((e, i) => {
            const isMe = currentUser && e.uid === currentUser.uid;
            const cls = isMe ? ' me' : '';
            const rankIcon = i === 0 ? '<i class="fas fa-crown" style="color:#FCD34D"></i>' : (i+1);
            html += `<div class="lb-entry${cls}"><span class="lb-rank">${rankIcon}</span><span class="lb-name">${e.name}</span><span class="lb-sc">${e.score}</span></div>`;
        });
        lbContainer.innerHTML = html;
    });
}

document.getElementById('btn-leaderboard').addEventListener('click', () => { renderOnlineLeaderboard(); showScreen('rank-screen'); });
document.getElementById('btn-back-dash').addEventListener('click', () => showScreen('dash-screen'));

const CFG = {
    W: 380, H: 640, gravity: 0.42, jumpForce: -7.2, pipeBaseSpeed: 2.4,
    pipeWidth: 56, pipeGapBase: 148, pipeGapMin: 95, pipeInterval: 92,
    birdSize: 26, groundH: 54, hitMargin: 3, maxLives: 3, invincibleTime: 120
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let state = 'MENU';
let bird, pipes, particles, popups, stars, clouds, enemies, quizOrbs;
let score, frameCount, groundOffset, shakeIntensity, timeScale, canRetry;
let lives, invincibleTimer, currentLevel, pipesPassedCount;
let activeQuiz = null;

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function playSound(type) {
    if (!audioCtx) return; const t=audioCtx.currentTime, osc=audioCtx.createOscillator(), g=audioCtx.createGain(); osc.connect(g); g.connect(audioCtx.destination);
    switch(type) {
        case 'jump': osc.type='sine'; osc.frequency.setValueAtTime(420,t); osc.frequency.exponentialRampToValueAtTime(620,t+0.08); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12); osc.start(t); osc.stop(t+0.12); break;
        case 'score': osc.type='sine'; osc.frequency.setValueAtTime(523,t); osc.frequency.setValueAtTime(659,t+0.06); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18); osc.start(t); osc.stop(t+0.18); break;
        case 'hit': osc.type='sawtooth'; osc.frequency.setValueAtTime(180,t); osc.frequency.exponentialRampToValueAtTime(40,t+0.3); g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35); osc.start(t); osc.stop(t+0.35); break;
        case 'powerup': osc.type='sine'; osc.frequency.setValueAtTime(600,t); osc.frequency.exponentialRampToValueAtTime(1200,t+0.2); g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3); osc.start(t); osc.stop(t+0.3); break;
        case 'correct': osc.type='sine'; osc.frequency.setValueAtTime(800,t); osc.frequency.setValueAtTime(1000,t+0.1); osc.frequency.setValueAtTime(1200,t+0.2); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); osc.start(t); osc.stop(t+0.4); break;
        case 'wrong': osc.type='square'; osc.frequency.setValueAtTime(200,t); osc.frequency.exponentialRampToValueAtTime(100,t+0.3); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); osc.start(t); osc.stop(t+0.4); break;
        case 'levelup': osc.type='sine'; osc.frequency.setValueAtTime(500,t); osc.frequency.setValueAtTime(700,t+0.1); osc.frequency.setValueAtTime(900,t+0.2); osc.frequency.setValueAtTime(1200,t+0.3); g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5); osc.start(t); osc.stop(t+0.5); break;
    }
}

const levels = [
    { name: "LOW", minScore: 0, speedM: 1.0, gapM: 1.0, enemyRate: 999, enemySpeedM: 1.0 },
    { name: "MEDIUM", minScore: 10, speedM: 1.2, gapM: 0.95, enemyRate: 180, enemySpeedM: 1.2 },
    { name: "HIGH", minScore: 25, speedM: 1.4, gapM: 0.9, enemyRate: 140, enemySpeedM: 1.4 },
    { name: "ABSOLUTE", minScore: 40, speedM: 1.6, gapM: 0.85, enemyRate: 110, enemySpeedM: 1.6 },
    { name: "IMMORTAL", minScore: 50, speedM: 2.2, gapM: 0.8, enemyRate: 90, enemySpeedM: 2.0 }, 
    { name: "TINGKAT DEWA", minScore: 80, speedM: 2.5, gapM: 0.75, enemyRate: 75, enemySpeedM: 2.2 },
    { name: "GOD", minScore: 100, speedM: 2.8, gapM: 0.7, enemyRate: 60, enemySpeedM: 2.5 },
    { name: "GODS", minScore: 150, speedM: 3.2, gapM: 0.65, enemyRate: 45, enemySpeedM: 3.0 }
];
function getDifficulty() { let diff=levels[0]; for(let i=0;i<levels.length;i++){if(score>=levels[i].minScore)diff=levels[i];} return diff; }

function generateMathQuiz() {
    let a, b, answer, qText; let maxNum = 10 + Math.floor(score / 2); let opIndex = Math.floor(Math.random() * 3);
    if (opIndex === 0) { a = Math.floor(Math.random() * maxNum) + 1; b = Math.floor(Math.random() * maxNum) + 1; answer = a + b; qText = `${a} + ${b} = ?`; }
    else if (opIndex === 1) { a = Math.floor(Math.random() * maxNum) + 1; b = Math.floor(Math.random() * a) + 1; answer = a - b; qText = `${a} - ${b} = ?`; }
    else { a = Math.floor(Math.random() * 12) + 2; b = Math.floor(Math.random() * 12) + 2; answer = a * b; qText = `${a} x ${b} = ?`; }
    let options = [answer];
    while (options.length < 4) { let offset = Math.floor(Math.random() * 10) - 5; if (offset === 0) offset = 1; let wrong = answer + offset; if (wrong < 0) wrong = answer + Math.abs(offset); if (!options.includes(wrong)) options.push(wrong); }
    for (let i = options.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [options[i], options[j]] = [options[j], options[i]]; }
    return { q: qText, a: options.map(String), c: options.indexOf(answer) };
}

const skyPhases = [
    { score: 0, top: '#1C1917', bot: '#44403C', glow: 'rgba(249,115,22,0.1)' },
    { score: 25, top: '#4C1D95', bot: '#7C3AED', glow: 'rgba(168,85,247,0.15)' },
    { score: 50, top: '#1A0000', bot: '#3B0000', glow: 'rgba(239,68,68,0.15)' }, // Merah darah pas speed 50+
    { score: 100, top: '#000000', bot: '#0F172A', glow: 'rgba(99,102,241,0.2)' }
];
function getCurrentSky() { let c=skyPhases[0]; for(let i=0;i<skyPhases.length;i++){if(score>=skyPhases[i].score)c=skyPhases[i];} return c; }

function initStars(){stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*CFG.W,y:Math.random()*(CFG.H-CFG.groundH-80),r:Math.random()*1.4+0.4,bright:Math.random()*0.4+0.3,speed:Math.random()*2+0.8,phase:Math.random()*Math.PI*2});}
function initClouds(){clouds=[];for(let i=0;i<5;i++)clouds.push({x:Math.random()*CFG.W,y:40+Math.random()*140,w:40+Math.random()*55,speed:0.15+Math.random()*0.25,alpha:0.06+Math.random()*0.08});}

function resetGame() {
    bird={x:80,y:CFG.H/2,vy:0,rot:0}; pipes=[]; particles=[]; popups=[]; enemies=[]; quizOrbs=[];
    score=0; frameCount=0; groundOffset=0; shakeIntensity=0; timeScale=1.0; canRetry=false;
    lives=CFG.maxLives; invincibleTimer=0; activeQuiz=null; currentLevel="AWAL"; pipesPassedCount=0;
}

function createPipe(){const diff=getDifficulty(),baseGap=CFG.pipeGapBase*diff.gapM,gap=Math.max(baseGap,CFG.pipeGapMin),minTop=50,maxTop=CFG.H-CFG.groundH-gap-minTop,topH=Math.floor(Math.random()*(maxTop-minTop+1))+minTop;pipes.push({x:CFG.W+10,topH,gap,scored:false});}
function spawnEnemy(){const y=50+Math.random()*(CFG.H-CFG.groundH-150);enemies.push({x:CFG.W+20,y:y,baseY:y,width:28,height:22,phase:Math.random()*Math.PI});}
function spawnQuizOrb(){const y=100+Math.random()*(CFG.H-CFG.groundH-200);quizOrbs.push({x:CFG.W+15,y:y,size:20,phase:Math.random()*Math.PI});}

function spawnTrail(){particles.push({x:bird.x-CFG.birdSize/2,y:bird.y+(Math.random()-0.5)*CFG.birdSize*0.5,vx:-0.6-Math.random()*1.2,vy:(Math.random()-0.5)*0.6,life:1,decay:0.04+Math.random()*0.03,size:1.5+Math.random()*2.5,color:Math.random()>0.4?'#FB923C':'#FCD34D'});}
function spawnJumpBurst(){for(let i=0;i<5;i++)particles.push({x:bird.x-CFG.birdSize/2+Math.random()*6,y:bird.y+CFG.birdSize/2,vx:-0.8-Math.random()*1.5,vy:1.5+Math.random()*2.5,life:1,decay:0.04+Math.random()*0.03,size:2+Math.random()*3,color:Math.random()>0.5?'#FB923C':'#FCD34D'});}
function spawnDeathBurst(){const cols=['#F97316','#FCD34D','#EF4444','#FB923C','#FBBF24'];for(let i=0;i<28;i++){const a=(Math.PI*2*i)/28+Math.random()*0.4,sp=2+Math.random()*5;particles.push({x:bird.x,y:bird.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.012+Math.random()*0.02,size:3+Math.random()*5,color:cols[Math.floor(Math.random()*cols.length)]});}}
function spawnHitBurst(){const cols=['#EF4444','#FCA5A5','#F87171'];for(let i=0;i<12;i++){const a=(Math.PI*2*i)/12+Math.random()*0.4,sp=1.5+Math.random()*3;particles.push({x:bird.x,y:bird.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.03,size:2+Math.random()*3,color:cols[Math.floor(Math.random()*cols.length)]});}}
function spawnScorePopup(txt,col){popups.push({x:bird.x+28,y:bird.y-18,text:txt||'+1',life:1,vy:-1.2,color:col||'#FCD34D'});}
function spawnLevelUpPopup(txt){popups.push({x:CFG.W/2,y:CFG.H/2-50,text:txt,life:2,vy:-0.5,color:'#EF4444'});}

function updateParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*timeScale;p.y+=p.vy*timeScale;p.vy+=0.04*timeScale;p.life-=p.decay*timeScale;if(p.life<=0)particles.splice(i,1);}}
function updatePopups(){for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.y+=p.vy*timeScale;p.life-=0.025*timeScale;if(p.life<=0)popups.splice(i,1);}}

function updatePipes(){
    const diff=getDifficulty(),speed=CFG.pipeBaseSpeed*diff.speedM*timeScale;
    for(let i=pipes.length-1;i>=0;i--){
        const p=pipes[i]; p.x-=speed;
        if(!p.scored&&p.x+CFG.pipeWidth<bird.x){
            p.scored=true; score++; pipesPassedCount++; playSound('score'); spawnScorePopup(); checkLevelUp();
 
            if(pipesPassedCount % 3 === 0) spawnQuizOrb();
        }
        if(p.x+CFG.pipeWidth<-10)pipes.splice(i,1);
    }
    if(frameCount%CFG.pipeInterval===0)createPipe();
}
function updateEnemies(){
    const diff=getDifficulty(),speed=(CFG.pipeBaseSpeed+1)*diff.enemySpeedM*timeScale;
    for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.x-=speed;const waveAmp=35+(diff.speedM*15);e.y=e.baseY+Math.sin(frameCount*0.04*diff.speedM+e.phase)*waveAmp;if(e.x+e.width<-20)enemies.splice(i,1);}
    if(frameCount%Math.floor(diff.enemyRate)===0&&score>=10)spawnEnemy();
}
function updateQuizOrbs(){
    const diff=getDifficulty(),speed=CFG.pipeBaseSpeed*diff.speedM*timeScale;
    for(let i=quizOrbs.length-1;i>=0;i--){const q=quizOrbs[i];q.x-=speed;q.y+=Math.sin(frameCount*0.03+q.phase)*0.8;if(q.x+q.size<-20)quizOrbs.splice(i,1);}
}

function checkLevelUp() { const diff=getDifficulty(); if(diff.name!==currentLevel){currentLevel=diff.name;playSound('levelup');spawnLevelUpPopup("LEVEL: "+currentLevel);} }

function checkCollision(){
    if(invincibleTimer>0)return false;const m=CFG.hitMargin,bx=bird.x-CFG.birdSize/2+m,by=bird.y-CFG.birdSize/2+m,bw=CFG.birdSize-m*2,bh=CFG.birdSize-m*2;
    if(by+bh>=CFG.H-CFG.groundH||by<=0)return true;
    for(const p of pipes){if(bx+bw>p.x&&bx<p.x+CFG.pipeWidth){if(by<p.topH||by+bh>p.topH+p.gap)return true;}}
    for(const e of enemies){if(bx+bw>e.x&&bx<e.x+e.width&&by+bh>e.y&&by<e.y+e.height)return true;}
    return false;
}
function checkQuizCollision(){
    const bx=bird.x-CFG.birdSize/2,by=bird.y-CFG.birdSize/2,bw=CFG.birdSize,bh=CFG.birdSize;
    for(let i=quizOrbs.length-1;i>=0;i--){const q=quizOrbs[i];if(bx+bw>q.x-q.size&&bx<q.x+q.size&&by+bh>q.y-q.size&&by<q.y+q.size){quizOrbs.splice(i,1);return true;}}
    return false;
}

function updateBird(){bird.vy+=CFG.gravity*timeScale;bird.y+=bird.vy*timeScale;const target=Math.min(Math.max(bird.vy*4,-35),80);bird.rot+=(target-bird.rot)*0.12*timeScale;if(invincibleTimer>0)invincibleTimer-=timeScale;}

function startQuiz(){state='QUIZ';timeScale=0;activeQuiz={data:generateMathQuiz(),result:null};}

function drawBg(){const sky=getCurrentSky(),g=ctx.createLinearGradient(0,0,0,CFG.H);g.addColorStop(0,sky.top);g.addColorStop(1,sky.bot);ctx.fillStyle=g;ctx.fillRect(0,0,CFG.W,CFG.H);const rg=ctx.createRadialGradient(CFG.W/2,CFG.H,0,CFG.W/2,CFG.H,CFG.H*0.65);rg.addColorStop(0,sky.glow);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,CFG.W,CFG.H);}
function drawStars(){if(score<25)return;const now=Date.now();for(const s of stars){const tw=0.5+0.5*Math.sin(now*0.001*s.speed+s.phase);ctx.globalAlpha=tw*s.bright;ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(s.x,s.y,Math.max(0.1,s.r),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function drawClouds(){const am=score>=15?0.5:1.0;for(const c of clouds){ctx.fillStyle=`rgba(255,255,255,${c.alpha*am})`;ctx.beginPath();ctx.ellipse(c.x,c.y,c.w/2,c.w/5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.x-c.w*0.28,c.y+4,c.w*0.3,c.w*0.17,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.x+c.w*0.3,c.y+3,c.w*0.32,c.w*0.19,0,0,Math.PI*2);ctx.fill();}}
function updateClouds(){for(const c of clouds){c.x-=c.speed*timeScale;if(c.x+c.w<-20){c.x=CFG.W+30;c.y=40+Math.random()*140;}}}
function drawPipes(){for(const p of pipes){const pw=CFG.pipeWidth,capW=pw+12,capH=22,capX=p.x-6;drawPipeBody(p.x,0,pw,p.topH);drawPipeCap(capX,p.topH-capH,capW,capH);const bY=p.topH+p.gap,bH=CFG.H-CFG.groundH-bY;drawPipeBody(p.x,bY,pw,bH);drawPipeCap(capX,bY,capW,capH);}}
function drawPipeBody(x,y,w,h){if(h<=0)return;const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#047857');g.addColorStop(0.35,'#10B981');g.addColorStop(0.65,'#10B981');g.addColorStop(1,'#047857');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(x+6,y,4,h);ctx.strokeStyle='#065F46';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);}
function drawPipeCap(x,y,w,h){const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#065F46');g.addColorStop(0.3,'#10B981');g.addColorStop(0.7,'#10B981');g.addColorStop(1,'#065F46');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(x+6,y,4,h);ctx.strokeStyle='#065F46';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);}
function drawGround(){const y=CFG.H-CFG.groundH;ctx.fillStyle='#1C1917';ctx.fillRect(0,y,CFG.W,CFG.groundH);ctx.fillStyle='#16A34A';ctx.fillRect(0,y,CFG.W,7);ctx.fillStyle='#22C55E';const off=groundOffset%18;for(let x=-18+off;x<CFG.W+18;x+=18){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+9,y-5);ctx.lineTo(x+18,y);ctx.fill();}ctx.strokeStyle='#15803D';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y+7);ctx.lineTo(CFG.W,y+7);ctx.stroke();}

function drawBird(){
    if(invincibleTimer>0&&Math.floor(invincibleTimer/5)%2===0)return;ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot*Math.PI/180);const s=CFG.birdSize,hs=s/2;
    ctx.shadowColor='#F97316';ctx.shadowBlur=16;const bg=ctx.createLinearGradient(-hs,-hs,hs,hs);bg.addColorStop(0,'#FBBF24');bg.addColorStop(0.5,'#F97316');bg.addColorStop(1,'#EA580C');ctx.fillStyle=bg;roundRect(ctx,-hs,-hs,s,s,5);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#9A3412';ctx.lineWidth=2;roundRect(ctx,-hs,-hs,s,s,5);ctx.stroke();ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(-hs+3,-hs+3,s*0.35,s*0.3);ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(hs*0.22,-hs*0.18,s*0.19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1C1917';ctx.beginPath();ctx.arc(hs*0.32,-hs*0.16,s*0.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#DC2626';ctx.beginPath();ctx.moveTo(hs,-hs*0.1);ctx.lineTo(hs+7,hs*0.1);ctx.lineTo(hs,hs*0.3);ctx.closePath();ctx.fill();ctx.restore();
}

function drawEnemies(){for(const e of enemies){ctx.save();ctx.translate(e.x+e.width/2,e.y+e.height/2);ctx.fillStyle='#B91C1C';ctx.beginPath();ctx.ellipse(0,0,e.width/2,e.height/2,0,0,Math.PI*2);ctx.fill();const wingY=Math.sin(Date.now()*0.015)*6;ctx.fillStyle='#991B1B';ctx.beginPath();ctx.moveTo(-3,0);ctx.lineTo(-15,-10+wingY);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(6,-3,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(7,-3,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#F59E0B';ctx.beginPath();ctx.moveTo(e.width/2,-1);ctx.lineTo(e.width/2+8,2);ctx.lineTo(e.width/2,5);ctx.closePath();ctx.fill();ctx.restore();}}

function drawQuizOrbs(){const pulse=1+0.2*Math.sin(Date.now()*0.005);for(const q of quizOrbs){ctx.save();ctx.translate(q.x,q.y);ctx.shadowColor='#10B981';ctx.shadowBlur=25;ctx.fillStyle='#10B981';ctx.beginPath();ctx.arc(0,0,q.size*pulse,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#FFF';ctx.font='900 18px Nunito';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',0,1);ctx.restore();}}

function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.1,p.size*p.life),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
function drawPopups(){for(const p of popups){ctx.globalAlpha=Math.max(0,p.life);ctx.font=p.text.includes('LEVEL')?'900 24px Bungee, sans-serif':'900 18px Nunito, sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.color||'#FCD34D';ctx.fillText(p.text,p.x,p.y);}ctx.globalAlpha=1;}

function drawHUD(){
    ctx.font='900 40px Bungee, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.strokeText(score,CFG.W/2,30);ctx.fillStyle='#FFF';ctx.fillText(score,CFG.W/2,30);
    for(let i=0;i<CFG.maxLives;i++){const hx=22+i*32,hy=18;ctx.fillStyle=i<lives?'#EF4444':'rgba(255,255,255,0.2)';drawHeart(hx,hy,14,ctx.fillStyle);}
    ctx.font='800 14px Nunito, sans-serif';ctx.textAlign='right';ctx.textBaseline='top';ctx.fillStyle='#A3A3A3';ctx.fillText('LEVEL',CFG.W-20,15);ctx.font='900 18px Bungee, sans-serif';ctx.fillStyle='#EF4444';ctx.fillText(currentLevel,CFG.W-20,32);
}
function drawHeart(x,y,size,color){ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y+size/4);ctx.quadraticCurveTo(x,y,x+size/4,y);ctx.quadraticCurveTo(x+size/2,y,x+size/2,y+size/4);ctx.quadraticCurveTo(x+size/2,y,x+size*3/4,y);ctx.quadraticCurveTo(x+size,y,x+size,y+size/4);ctx.quadraticCurveTo(x+size,y+size/2,x+size/2,y+size*3/4);ctx.quadraticCurveTo(x,y+size/2,x,y+size/4);ctx.fill();ctx.closePath();ctx.restore();}
function drawReadyText(){const pulse=0.5+0.5*Math.sin(Date.now()*0.004);ctx.globalAlpha=pulse;ctx.font='800 17px Nunito, sans-serif';ctx.textAlign='center';ctx.fillStyle='#FFF';ctx.fillText('Tekan untuk Terbang',CFG.W/2,CFG.H/2+60);ctx.globalAlpha=1;}

function drawFloatingDash(){
    if(!canRetry)return;ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,0,CFG.W,CFG.H);const bw=240,bh=120,bx=(CFG.W-bw)/2,by=(CFG.H-bh)/2-40;ctx.fillStyle='rgba(10,10,10,0.85)';ctx.strokeStyle='rgba(249,115,22,0.6)';ctx.lineWidth=2;roundRect(ctx,bx,by,bw,bh,12);ctx.fill();ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 28px Bungee, sans-serif';ctx.fillStyle='#FFF';ctx.fillText('GAME OVER',CFG.W/2,by+45);const pulse=0.8+0.2*Math.sin(Date.now()*0.005);ctx.globalAlpha=pulse;ctx.font='800 16px Nunito, sans-serif';ctx.fillStyle='#F97316';ctx.fillText('TAP UNTUK DASHBOARD',CFG.W/2,by+85);ctx.globalAlpha=1;
}

function drawQuizUI(){if(!activeQuiz)return;ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,CFG.W,CFG.H);const bw=300,bh=360,bx=(CFG.W-bw)/2,by=(CFG.H-bh)/2;ctx.fillStyle='rgba(15,15,15,0.95)';ctx.strokeStyle='#10B981';ctx.lineWidth=3;roundRect(ctx,bx,by,bw,bh,15);ctx.fill();ctx.stroke();ctx.fillStyle='#10B981';ctx.font='900 22px Bungee, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('KUIS MATEMATIKA',CFG.W/2,by+40);ctx.fillStyle='#FFF';ctx.font='900 28px Bungee, sans-serif';ctx.fillText(activeQuiz.data.q,CFG.W/2,by+90);if(activeQuiz.result===null){const opts=activeQuiz.data.a;for(let i=0;i<opts.length;i++){const oy=by+140+i*50,ox=bx+25,ow=bw-50,oh=42;ctx.fillStyle='rgba(255,255,255,0.1)';ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;roundRect(ctx,ox,oy,ow,oh,8);ctx.fill();ctx.stroke();ctx.fillStyle='#FFF';ctx.font='800 18px Nunito, sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(opts[i],ox+20,oy+oh/2);activeQuiz.data['box'+i]={x:ox,y:oy,w:ow,h:oh};}}else{ctx.font='900 30px Bungee, sans-serif';if(activeQuiz.result){ctx.fillStyle='#10B981';ctx.fillText('BENAR!',CFG.W/2,by+190);ctx.font='800 18px Nunito';ctx.fillStyle='#FFF';ctx.fillText('+5 Poin & +1 Nyawa',CFG.W/2,by+230);}else{ctx.fillStyle='#EF4444';ctx.fillText('SALAH!',CFG.W/2,by+190);ctx.font='800 16px Nunito';ctx.fillStyle='#FFF';ctx.fillText('Lanjutkan bermain',CFG.W/2,by+230);}const pulse=0.5+0.5*Math.sin(Date.now()*0.005);ctx.globalAlpha=pulse;ctx.font='700 14px Nunito';ctx.fillStyle='#FFF';ctx.fillText('Tap untuk lanjutkan...',CFG.W/2,by+290);ctx.globalAlpha=1;}}
function roundRect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function drawVignette(){const rg=ctx.createRadialGradient(CFG.W/2,CFG.H/2,CFG.H*0.25,CFG.W/2,CFG.H/2,CFG.H*0.75);rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,0.35)');ctx.fillStyle=rg;ctx.fillRect(0,0,CFG.W,CFG.H);}

function startReady(){initAudio();resetGame();state='READY';showScreen(null);}
function handleTap(x,y){
    initAudio();
    if(state==='READY'){state='PLAYING';bird.vy=CFG.jumpForce;playSound('jump');spawnJumpBurst();return;}
    if(state==='PLAYING'){bird.vy=CFG.jumpForce;playSound('jump');spawnJumpBurst();return;}
    if(state==='DEAD'&&canRetry){saveScoreToFirebase(score);loadUserDataAndShowDash();return;}
    
    if(state==='QUIZ'&&activeQuiz){
        if(activeQuiz.result!==null){activeQuiz=null;timeScale=1.0;state='PLAYING';return;}
        for(let i=0;i<4;i++){const box=activeQuiz.data['box'+i];if(box&&x>=box.x&&x<=box.x+box.w&&y>=box.y&&y<=box.y+box.h){if(i===activeQuiz.data.c){activeQuiz.result=true;score+=5;lives=Math.min(lives+1,CFG.maxLives);playSound('correct');spawnScorePopup('+5 & Nyawa','#10B981');}else{activeQuiz.result=false;playSound('wrong');}return;}}
    }
}

function takeDamage(){if(invincibleTimer>0)return;lives--;spawnHitBurst();shakeIntensity=10;playSound('hit');if(lives<=0){die();}else{invincibleTimer=CFG.invincibleTime;bird.vy=-4;}}
function die(){if(state==='DYING'||state==='DEAD')return;state='DYING';playSound('hit');spawnDeathBurst();shakeIntensity=12;timeScale=0.2;bird.vy=-4;setTimeout(()=>{timeScale=0;state='DEAD';canRetry=true;},800);}

function update(){
    updateClouds();
    if(state==='READY'){bird.y=CFG.H/2+Math.sin(Date.now()*0.003)*14;bird.rot=0;groundOffset+=1;}
    if(state==='PLAYING'){updateBird();updatePipes();updateEnemies();updateQuizOrbs();updateParticles();updatePopups();frameCount++;groundOffset+=CFG.pipeBaseSpeed*getDifficulty().speedM;if(frameCount%3===0)spawnTrail();if(checkCollision())takeDamage();if(state==='PLAYING'&&checkQuizCollision()){startQuiz();playSound('powerup');}}
    if(state==='DYING'){updateBird();updateParticles();updatePopups();timeScale=Math.max(0,timeScale-0.005);}
    if(state==='DEAD'){updateParticles();updatePopups();}
    if(shakeIntensity>0.3)shakeIntensity*=0.9;else shakeIntensity=0;
}

function render(){
    ctx.save();if(shakeIntensity>0){ctx.translate((Math.random()-0.5)*shakeIntensity,(Math.random()-0.5)*shakeIntensity);}
    drawBg();drawStars();drawClouds();drawPipes();drawEnemies();drawQuizOrbs();drawGround();drawParticles();if(state!=='MENU')drawBird();drawPopups();
    if(state==='PLAYING'||state==='DYING')drawHUD();if(state==='READY'){drawHUD();drawReadyText();}if(state==='DEAD'){drawHUD();drawFloatingDash();}if(state==='QUIZ'){drawHUD();drawQuizUI();}
    drawVignette();ctx.restore();
}

function gameLoop(){update();render();requestAnimationFrame(gameLoop);}

const wrapper=document.getElementById('game-wrapper');
function getCanvasCoords(e){const rect=canvas.getBoundingClientRect(),scaleX=CFG.W/rect.width,scaleY=CFG.H/rect.height;let cx,cy;if(e.touches){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}else{cx=e.clientX;cy=e.clientY;}return{x:(cx-rect.left)*scaleX,y:(cy-rect.top)*scaleY};}
wrapper.addEventListener('mousedown',(e)=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;const c=getCanvasCoords(e);handleTap(c.x,c.y);});
wrapper.addEventListener('touchstart',(e)=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;e.preventDefault();const c=getCanvasCoords(e);handleTap(c.x,c.y);},{passive:false});
window.addEventListener('keydown',(e)=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();handleTap(CFG.W/2,CFG.H/2);}});

document.getElementById('btn-play').addEventListener('click',()=>{if(currentUser)startReady();});

function resize(){const wr=document.getElementById('game-wrapper'),ratio=CFG.W/CFG.H,maxW=window.innerWidth,maxH=window.innerHeight;let w,h;if(maxW/maxH>ratio){h=maxH;w=h*ratio;}else{w=maxW;h=w/ratio;}wr.style.width=Math.floor(w)+'px';wr.style.height=Math.floor(h)+'px';}
window.addEventListener('resize',resize);

function init(){canvas.width=CFG.W;canvas.height=CFG.H;initStars();initClouds();resetGame();resize();requestAnimationFrame(gameLoop);}
init();
</script>
</body>
